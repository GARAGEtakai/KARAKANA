<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>カラカナ移転スケジュール</title>
<style>
:root {
  --ink: #222;
  --ink-soft: #888;
  --border: #ddd;
  --bg: #fff;
  --grey: #dcdcdc;
  --grey-line: #939393;
  --teal: #bcdbd4;
  --teal-line: #4a7c74;
  --red: #f3b8b2;
  --red-line: #b8433a;
  --blue: #b9d3e0;
  --blue-line: #3b6e8f;
  --mustard: #f0d78a;
  --mustard-line: #a9822a;
}
* { box-sizing: border-box; }
body, .karakana-root { margin: 0; padding: 0; }
.karakana-root {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
  color: var(--ink);
  background: var(--bg);
  min-height: 100vh;
}

/* ---------- Gate ---------- */
.gate {
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px 18px;
}
.gate-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; text-align: center; }
.gate-sub { font-size: 13px; color: var(--ink-soft); margin-bottom: 18px; text-align: center; }
.gate-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; max-width: 340px; }
.gate-btn {
  font-size: 14px; padding: 14px 6px; border: 1px solid var(--border); border-radius: 6px;
  background: #f7f7f7; color: var(--ink); cursor: pointer;
}
.gate-btn:active { background: #ececec; }

/* ---------- Header ---------- */
.app-header {
  position: sticky; top: 0; z-index: 30; background: #fff;
  border-bottom: 1px solid var(--border); padding: 10px 12px 8px;
}
.app-header-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.app-title { font-size: 15px; font-weight: 700; }
.identity-chip { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.identity-badge { background: #eee; padding: 3px 8px; border-radius: 3px; font-weight: 600; }
.identity-change, .refresh-btn { font-size: 11.5px; color: var(--ink-soft); background: #fff; border: 1px solid var(--border); border-radius: 3px; padding: 4px 8px; cursor: pointer; }
.toolbar { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.save-status { font-size: 10.5px; color: var(--ink-soft); margin-left: auto; }

.tabs { display: flex; gap: 6px; margin-top: 8px; }
.tab { flex: 1; text-align: center; padding: 7px 0; font-size: 13px; border: 1px solid var(--border); border-radius: 5px; background: #f7f7f7; cursor: pointer; }
.tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }

.hint-banner { margin: 8px 12px 0; padding: 7px 10px; background: #f7f7f7; border: 1px solid var(--border); border-radius: 5px; font-size: 11.5px; color: var(--ink-soft); }

/* ---------- Table ---------- */
.table-scroll { padding: 10px 8px 60px; overflow-x: auto; }
table.gantt { border-collapse: collapse; width: 100%; font-size: 10.5px; table-layout: fixed; }
.gantt th, .gantt td { border: 1px solid var(--border); text-align: center; height: 38px; padding: 0; position: relative; }
.gantt th { font-size: 10px; font-weight: 600; background: #f7f7f7; padding: 4px 1px; position: sticky; top: 0; z-index: 5; }
.date-col { width: 44px; font-family: 'SFMono-Regular', Consolas, monospace; font-size: 10px; background: #f7f7f7; text-align: left !important; padding-left: 4px !important; white-space: nowrap; position: sticky; left: 0; z-index: 4; }
th.date-col { z-index: 6; }
.date-col .wd { color: var(--ink-soft); font-size: 8.5px; margin-left: 2px; }
.date-col.weekend { background: #f0f0f0; }
.date-col.today { outline: 2px solid var(--red-line); outline-offset: -2px; }
.summary-col { width: 38px; background: #fbfbfb; }
.summary-badge { display: inline-flex; align-items: center; justify-content: center; padding: 1.5px 3px; border-radius: 3px; font-size: 7.5px; font-weight: 700; color: #fff; line-height: 1.2; max-width: 36px; overflow: hidden; }
.summary-label { font-size: 7px; color: var(--ink-soft); display: block; margin-top: 1px; }

td.day-cell.editable { cursor: pointer; }
td.day-cell.editable:active { background: #f2f2f2; }
td.day-cell.locked { cursor: default; }

.tag-box { position: absolute; inset: 3px 2px; border-radius: 4px; font-size: 8.5px; display: flex; align-items: center; justify-content: center; line-height: 1.05; overflow: hidden; }

.fill-start { position: absolute; inset: 2px 2px 0 2px; border-radius: 4px 4px 0 0 !important; border-bottom: none !important; font-size: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.fill-mid { position: absolute; inset: 0 2px; border-radius: 0 !important; border-top: none !important; border-bottom: none !important; }
.fill-end { position: absolute; inset: 0 2px 2px 2px; border-radius: 0 0 4px 4px !important; border-top: none !important; }
.fill-single { position: absolute; inset: 3px 2px; border-radius: 4px; font-size: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.entry-band { position: absolute; top: 0; bottom: 0; }
.entry-band .fill-mid { inset: 0 1px; }
.entry-band .fill-start { inset: 2px 1px 0 1px; font-size: 6.5px; }
.entry-band .fill-end { inset: 0 1px 2px 1px; }
.entry-band .fill-single { inset: 3px 1px; font-size: 6.5px; }



.c-grey { background: var(--grey); border: 1px solid var(--grey-line); color: #333; }
.c-red { background: var(--red); border: 1px solid var(--red-line); color: #6e211b; }
.c-teal { background: var(--teal); border: 1px solid var(--teal-line); color: #234b44; }
.c-mustard { background: var(--mustard); border: 1px solid var(--mustard-line); color: #55420f; }
.c-blue { background: var(--blue); border: 1px solid var(--blue-line); color: #1c3a4b; }

/* ---------- Modal ---------- */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 640px) { .overlay { align-items: center; } }
.sheet { background: #fff; width: 100%; max-width: 420px; border-radius: 10px 10px 0 0; padding: 18px; border: 1px solid var(--border); max-height: 86vh; overflow-y: auto; }
@media (min-width: 640px) { .sheet { border-radius: 10px; } }
.sheet-title { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
.sheet-sub { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 14px; }
.field-label { font-size: 12px; color: var(--ink-soft); margin: 10px 0 5px; display: block; }
.date-row { display: flex; align-items: center; gap: 8px; }
.date-row input[type=date] { flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 5px; font-size: 13px; }
.chk-row { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-top: 6px; color: var(--ink-soft); }
.tag-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
.tag-opt { border: 1px solid var(--border); border-radius: 5px; padding: 8px 3px; font-size: 12px; cursor: pointer; text-align: center; background: #f7f7f7; }
.tag-opt.selected { outline: 2px solid var(--ink); outline-offset: -2px; font-weight: 700; }
.memo-input { width: 100%; border: 1px solid var(--border); border-radius: 5px; padding: 9px; font-size: 13.5px; resize: vertical; min-height: 54px; margin-top: 4px; }
.sheet-actions { display: flex; gap: 8px; margin-top: 16px; }
.btn { flex: 1; padding: 10px; border-radius: 6px; font-size: 13.5px; font-weight: 600; border: 1px solid var(--border); cursor: pointer; background: #f7f7f7; }
.btn-primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn-danger { color: var(--red-line); }
.readonly-note { font-size: 12px; color: var(--ink-soft); background: #f7f7f7; border-radius: 5px; padding: 9px; margin-bottom: 10px; }
.summary-list { font-size: 13px; margin-top: 8px; }
.summary-list div { padding: 6px 0; border-bottom: 1px solid var(--border); }
.summary-list div:last-child { border-bottom: none; }
.summary-list .entry-list-item { display: flex; align-items: center; gap: 7px; padding: 9px 2px; border-bottom: 1px solid var(--border); font-size: 13px; cursor: pointer; }
.summary-list .entry-list-item:last-child { border-bottom: none; }
.entry-list-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
</style>

function pad2(n){ return n < 10 ? '0'+n : ''+n; }
function toLocalISO(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseISO(iso){ return new Date(iso+'T00:00:00'); }
function dateRange(startISO, endISO){
  const out = []; let d = parseISO(startISO); const end = parseISO(endISO);
  while (d <= end){ out.push(toLocalISO(d)); d.setDate(d.getDate()+1); }

let state = {

  data: {},

  saving: false,

function rowsForTab(){ return state.tab === 'member' ? ROWS_MEMBER : ROWS_CONSTRUCTION; }

function canEdit(rowId){
  if (!state.identity) return false;
  const row = ALL_ROWS.find(r => r.id === rowId);
  return row ? row.editableBy.includes(state.identity) : false;
}

function entriesFor(rowId){ return (state.data[rowId] || []); }

function assignLanes(rowId){
  const entries = entriesFor(rowId).slice().sort((a, b) => cmpDate(a.start, b.start));
  const laneOf = {};
  const clusterMaxLanes = {};
  let cluster = [];
  let clusterEnd = null;

  function flushCluster(){
    if (cluster.length === 0) return;
    const laneEndDates = [];
    cluster.forEach(e => {
      const eEnd = e.end || '2026-08-31';
      let placed = false;
      for (let i = 0; i < laneEndDates.length; i++) {
        if (cmpDate(e.start, laneEndDates[i]) > 0) {
          laneOf[e.id] = i;
          laneEndDates[i] = eEnd;
          placed = true;
          break;
        }
      }
      if (!placed) {
        laneOf[e.id] = laneEndDates.length;
        laneEndDates.push(eEnd);
      }
    });
    cluster.forEach(e => { clusterMaxLanes[e.id] = laneEndDates.length; });
    cluster = [];
    clusterEnd = null;
  }

  entries.forEach(e => {
    const eEnd = e.end || '2026-08-31';
    if (clusterEnd !== null && cmpDate(e.start, clusterEnd) <= 0) {
      cluster.push(e);
      if (cmpDate(eEnd, clusterEnd) > 0) clusterEnd = eEnd;
    } else {
      flushCluster();
      cluster.push(e);
      clusterEnd = eEnd;
    }
  });
  flushCluster();

  return { laneOf, clusterMaxLanes };
}

function entriesOnDate(rowId, dateISO){
  const list = entriesFor(rowId);
  return list.filter(e => {
    const end = e.end || '2026-08-31';
    return cmpDate(dateISO, e.start) >= 0 && cmpDate(dateISO, end) <= 0;
  });
}

function countOtherGroupOnDate(dateISO, group){
  const rows = group === 'construction' ? ROWS_CONSTRUCTION : ROWS_MEMBER;
  let items = [];
  rows.forEach(r => {
    entriesOnDate(r.id, dateISO).forEach(e => items.push({ row: r, entry: e }));
  });
  return items;
}

async function loadData(){
  try {
    const { data, error } = await sb.from('karakana_schedule').select('data').eq('slot', SLOT).maybeSingle();
    if (error) throw error;
    if (data && data.data && Object.keys(data.data).length > 0) {
      state.data = data.data;
    } else {
      state.data = buildSeed();
      const { error: upErr } = await sb.from('karakana_schedule').upsert({ slot: SLOT, data: state.data, updated_at: new Date().toISOString() });
      if (upErr) throw upErr;
    }
    state.connectionError = false;
  } catch (e) {
    console.error('karakana_schedule loadData error:', e);
    state.data = buildSeed();
    state.connectionError = true;
  }
  state.loaded = true;
  render();
}

let saveTimer = null;
function doSave(){
  return sb.from('karakana_schedule').upsert({ slot: SLOT, data: state.data, updated_at: new Date().toISOString() });
}
function scheduleSave(){
  state.saving = true; render();
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    saveTimer = null;
    try {
      const { error } = await doSave();
      if (error) throw error;
      state.connectionError = false;
    } catch(e) {
      console.error('karakana_schedule save error:', e);
      state.connectionError = true;
    }
    state.saving = false; render();
  }, 1200);
}
function flushPendingSave(){
  if (saveTimer) {
    clearTimeout(saveTimer);
    saveTimer = null;
    doSave().catch(e => console.error('karakana_schedule flush save error:', e));
  }
}
window.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushPendingSave(); });
window.addEventListener('pagehide', flushPendingSave);

async function refreshFromServer(){
  try {
    const { data, error } = await sb.from('karakana_schedule').select('data').eq('slot', SLOT).maybeSingle();
    if (error) throw error;
    if (data && data.data) { state.data = data.data; }
    state.connectionError = false;
    render();
  } catch(e) {
    console.error('karakana_schedule refresh error:', e);
    state.connectionError = true;
    render();
  }
}

function setIdentity(id){ state.identity = id; localStorage.setItem(IDENTITY_KEY, id); render(); loadData(); }
function changeIdentity(){ state.identity = null; localStorage.removeItem(IDENTITY_KEY); render(); }
function setTab(t){ state.tab = t; render(); }

function openCell(rowId, dateISO){
  if (!canEdit(rowId)) {
    state.activeCell = { row: rowId, date: dateISO, readonly: true };
  } else {
    state.activeCell = { row: rowId, date: dateISO, readonly: false, mode: 'list', entryId: null };
  }
  render();
}
function closeCell(){ state.activeCell = null; render(); }

function openNewEntryForm(){
  state.activeCell.mode = 'form';
  state.activeCell.entryId = null;
  render();
}
function openEditEntryForm(entryId){
  state.activeCell.mode = 'form';
  state.activeCell.entryId = entryId;
  render();
}
function backToList(){
  state.activeCell.mode = 'list';
  state.activeCell.entryId = null;
  render();
}

function saveEntry(rowId, entryId, tag, memo, start, end){
  if (!state.data[rowId]) state.data[rowId] = [];
  if (entryId) {
    const existing = state.data[rowId].find(e => e.id === entryId);
    if (existing) { existing.tag = tag; existing.memo = memo; existing.start = start; existing.end = end; }
  } else {
    state.data[rowId].push(mkEntry(tag, memo, start, end));
  }
  backToList();
  scheduleSave();
}
function deleteEntryById(rowId, entryId){
  if (state.data[rowId]) {
    state.data[rowId] = state.data[rowId].filter(e => e.id !== entryId);
  }
  backToList();
  scheduleSave();
}

function exportData(){
  const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = toLocalISO(new Date());
  a.href = url;
  a.download = `karakana_schedule_backup_${ts}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderGate(){
  return `
  <div class="gate">
    <div class="gate-title">カラカナ移転スケジュール</div>
    <div class="gate-sub">あなたの名前を選んでください</div>
    <div class="gate-grid">
      ${MEMBERS.map(m => `<button class="gate-btn" data-select-id="${m.id}">${esc(m.label)}</button>`).join('')}
    </div>
  </div>`;
}

function renderHeader(){
  const savingText = state.connectionError ? '⚠ 接続エラー' : (state.saving ? '保存中…' : '保存済み');
  return `
  <div class="app-header">
    <div class="app-header-row">
      <div class="app-title">カラカナ移転スケジュール</div>
      <div class="identity-chip">
        <span class="identity-badge">${esc(state.identity)}</span>
        <button class="identity-change" data-change-identity>切替</button>
      </div>
    </div>
    <div class="toolbar">
      <button class="refresh-btn" data-refresh>最新に更新</button>
      <button class="refresh-btn" data-export>エクスポート</button>
      <span class="save-status" style="${state.connectionError ? 'color:var(--red-line);font-weight:700;' : ''}">${savingText}</span>
    </div>
    ${state.connectionError ? `<div class="hint-banner" style="background:var(--red-soft,#f3b8b2);border-color:var(--red-line);color:#6e211b;">サーバーに接続できていません。保存・更新が反映されない可能性があります。時間をおいて「最新に更新」を押すか、ページを再読み込みしてください。</div>` : ''}
    <div class="tabs">
      <div class="tab ${state.tab==='member'?'active':''}" data-tab="member">メンバー・共有</div>
      <div class="tab ${state.tab==='construction'?'active':''}" data-tab="construction">施工スケジュール</div>
    </div>
  </div>`;
}

function renderHint(){
  const rows = rowsForTab().filter(r => canEdit(r.id)).map(r => r.label).join('・');
  return `<div class="hint-banner">編集できる欄：${esc(rows || 'なし（このタブは閲覧のみ）')}</div>`;
}

function tagBoxHtml(entry){
  const t = TAG_MAP[entry.tag] || TAG_MAP.other;
  const text = entry.memo ? entry.memo : t.label;
  return `<div class="tag-box c-${t.color}" title="${esc(text)}">${esc(text)}</div>`;
}

function renderSummaryCell(dateISO, group){
  const items = countOtherGroupOnDate(dateISO, group);
  if (items.length === 0) return `<td class="summary-col" data-summary="${dateISO}" data-group="${group}"></td>`;
  if (group === 'construction') {
    const labels = items.map(it => {
      if (it.entry.tag === 'construction_on') return CONSTRUCTION_ABBR[it.row.id] || it.row.label;
      return (TAG_MAP[it.entry.tag] || {}).label || it.row.label;
    });
    const text = [...new Set(labels)].join('');
    return `<td class="summary-col" data-summary="${dateISO}" data-group="${group}">
      <span class="summary-badge" style="background:var(--blue-line);">${esc(text)}</span>
    </td>`;
  }
  return `<td class="summary-col" data-summary="${dateISO}" data-group="${group}">
    <span class="summary-badge" style="background:var(--teal-line);">${items.length}</span>
    <span class="summary-label">予定</span>
  </td>`;
}

function renderEntryVisual(row, entry, dateISO){
  const isSingle = entry.start === entry.end;
  const t = TAG_MAP[entry.tag] || TAG_MAP.other;
  const isConstructionWork = row.group === 'construction' && entry.tag === 'construction_on';
  const label = entry.memo || (isConstructionWork ? (CONSTRUCTION_ABBR[row.id] || row.label) : t.label);
  if (isSingle) return `<div class="fill-single c-${t.color}">${esc(label)}</div>`;
  if (dateISO === entry.start) return `<div class="fill-start c-${t.color}">${esc(label)}</div>`;
  if (entry.end && dateISO === entry.end) return `<div class="fill-end c-${t.color}"></div>`;
  return `<div class="fill-mid c-${t.color}"></div>`;
}

function renderTable(){
  const rows = rowsForTab();
  const todayStr = todayISO();
  const laneInfo = {};
  rows.forEach(r => { laneInfo[r.id] = assignLanes(r.id); });

  let head = `<tr><th class="date-col">日付</th>`;
  if (state.tab === 'construction') head += `<th class="summary-col">共有等</th>`;
  rows.forEach(r => { head += `<th>${esc(r.label)}</th>`; });
  if (state.tab === 'member') head += `<th class="summary-col">施工</th>`;
  head += `</tr>`;

  let body = '';
  DATES.forEach(dateISO => {
    const { m, day, w, wd } = fmtLabel(dateISO);
    const weekend = wd === 0 || wd === 6;
    const isToday = dateISO === todayStr;
    const showMonth = day === 1 || dateISO === DATES[0];
    body += `<tr>`;
    body += `<td class="date-col ${weekend?'weekend':''} ${isToday?'today':''}">${showMonth?m+'/':''}${day}<span class="wd">${w}</span></td>`;
    if (state.tab === 'construction') body += renderSummaryCell(dateISO, 'member');

    rows.forEach(row => {
      const entries = entriesOnDate(row.id, dateISO);
      const editable = canEdit(row.id);
      const { laneOf, clusterMaxLanes } = laneInfo[row.id];
      let inner = '';
      if (entries.length === 1 && (clusterMaxLanes[entries[0].id] || 1) === 1) {
        inner = renderEntryVisual(row, entries[0], dateISO);
      } else {
        inner = entries.map(e => {
          const lanes = clusterMaxLanes[e.id] || 1;
          const lane = laneOf[e.id] || 0;
          const w = (100 / lanes).toFixed(2);
          return `<div class="entry-band" style="left:${(lane*100/lanes).toFixed(2)}%; width:${w}%;">${renderEntryVisual(row, e, dateISO)}</div>`;
        }).join('');
      }
      body += `<td class="day-cell ${editable?'editable':'locked'} ${weekend?'weekend':''}" data-row="${row.id}" data-date="${dateISO}">${inner}</td>`;
    });

    if (state.tab === 'member') body += renderSummaryCell(dateISO, 'construction');
    body += `</tr>`;
  });

  return `<div class="table-scroll"><table class="gantt">${head}${body}</table></div>`;
}

function renderCellModal(){
  if (!state.activeCell) return '';
  const { row, date, readonly, mode, entryId } = state.activeCell;
  const rowDef = ALL_ROWS.find(r => r.id === row);
  const entries = entriesOnDate(row, date);
  const d = parseISO(date);
  const dateLabel = `${d.getMonth()+1}月${d.getDate()}日（${WEEKDAY_JP[d.getDay()]}）`;

  if (readonly) {
    return `
    <div class="overlay" data-close-overlay>
      <div class="sheet" data-stop>
        <div class="sheet-title">${esc(rowDef.label)}</div>
        <div class="sheet-sub">${dateLabel}</div>
        <div class="readonly-note">この欄は閲覧のみです</div>
        ${entries.length ? `<div class="summary-list">${entries.map(e => `
          <div>${esc(e.memo || (TAG_MAP[e.tag]||{}).label || '')}
            ${e.start!==e.end ? `<div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px;">${e.start} 〜 ${e.end||'未定'}</div>` : ''}</div>
        `).join('')}</div>` : `<div style="font-size:13px;color:var(--ink-soft);">予定なし</div>`}
        <div class="sheet-actions"><button class="btn" data-close-overlay>閉じる</button></div>
      </div>
    </div>`;
  }

  if (mode === 'list') {
    return `
    <div class="overlay" data-close-overlay>
      <div class="sheet" data-stop>
        <div class="sheet-title">${esc(rowDef.label)}</div>
        <div class="sheet-sub">${dateLabel}</div>
        ${entries.length ? `<div class="summary-list">${entries.map(e => {
          const t = TAG_MAP[e.tag] || TAG_MAP.other;
          return `<div class="entry-list-item" data-edit-entry="${e.id}">
            <span class="entry-list-dot" style="background:var(--${t.color}-line);"></span>
            <span>${esc(e.memo || t.label)}</span>
            <span style="color:var(--ink-soft);font-size:11.5px;margin-left:auto;">${e.start}${e.start!==e.end?' 〜 '+(e.end||'未定'):''}</span>
          </div>`;
        }).join('')}</div>` : `<div style="font-size:13px;color:var(--ink-soft);margin-bottom:8px;">まだ予定がありません</div>`}
        <div class="sheet-actions">
          <button class="btn" data-close-overlay>閉じる</button>
          <button class="btn btn-primary" data-add-entry>＋ 予定を追加</button>
        </div>
      </div>
    </div>`;
  }

  // mode === 'form'
  const entry = entryId ? entries.find(e => e.id === entryId) : null;
  const tag = entry ? entry.tag : (rowDef.group === 'construction' ? 'construction_on' : '');
  const memo = entry ? entry.memo : '';
  const start = entry ? entry.start : date;
  const end = entry ? entry.end : date;
  const isOpen = entry ? !entry.end : false;

  return `
  <div class="overlay" data-close-overlay>
    <div class="sheet" data-stop>
      <div class="sheet-title">${esc(rowDef.label)}</div>
      <div class="sheet-sub">${dateLabel}${entries.length ? '・この日は他に'+entries.filter(e=>e.id!==entryId).length+'件あります' : ''}</div>

      <label class="field-label">期間</label>
      <div class="date-row">
        <input type="date" id="f-start" value="${start}" min="2026-07-10" max="2026-08-31">
        <span style="color:var(--ink-soft);font-size:12px;">〜</span>
        <input type="date" id="f-end" value="${end||''}" min="2026-07-10" max="2026-08-31" ${isOpen?'disabled':''}>
      </div>
      <label class="chk-row"><input type="checkbox" id="f-open" ${isOpen?'checked':''}> 終了日未定</label>

      <label class="field-label">タグ</label>
      <div class="tag-grid" id="f-tags">
        ${TAGS.map(t => `<div class="tag-opt ${tag===t.key?'selected':''}" data-tag-opt="${t.key}">${esc(t.label)}</div>`).join('')}
      </div>

      <label class="field-label">自由記述</label>
      <textarea class="memo-input" id="f-memo" placeholder="詳細があれば入力">${esc(memo)}</textarea>

      <div class="sheet-actions">
        <button class="btn" data-back-to-list>戻る</button>
        ${entry ? `<button class="btn btn-danger" data-delete-entry>削除</button>` : ''}
        <button class="btn btn-primary" data-save-entry>保存</button>
      </div>
    </div>
  </div>`;
}

function renderSummaryPopup(){
  if (!state.summaryPopup) return '';
  const { date, group } = state.summaryPopup;
  const items = countOtherGroupOnDate(date, group);
  const d = parseISO(date);
  const dateLabel = `${d.getMonth()+1}月${d.getDate()}日（${WEEKDAY_JP[d.getDay()]}）`;
  const title = group === 'construction' ? '施工スケジュール' : 'メンバー・共有';
  return `
  <div class="overlay" data-close-summary>
    <div class="sheet" data-stop>
      <div class="sheet-title">${esc(title)}</div>
      <div class="sheet-sub">${dateLabel}</div>
      ${items.length ? `<div class="summary-list">${items.map(it => `
        <div><strong>${esc(it.row.label)}</strong>：${esc(it.entry.memo || (TAG_MAP[it.entry.tag]||{}).label || '')}</div>
      `).join('')}</div>` : `<div style="font-size:13px;color:var(--ink-soft);">予定なし</div>`}
      <div class="sheet-actions"><button class="btn" data-close-summary>閉じる</button></div>
    </div>
  </div>`;
}

function render(){
  const root = document.getElementById('root');
  if (!state.identity) { root.innerHTML = renderGate(); bindGate(); return; }
  if (!state.loaded) { root.innerHTML = `<div class="gate"><div class="gate-sub">読み込み中…</div></div>`; return; }
  root.innerHTML = renderHeader() + renderHint() + renderTable() + renderCellModal() + renderSummaryPopup();
  bindApp();
}

function bindGate(){
  document.querySelectorAll('[data-select-id]').forEach(btn => {
    btn.addEventListener('click', () => setIdentity(btn.getAttribute('data-select-id')));
  });
}

let pendingTag = null;

function bindApp(){
  const chg = document.querySelector('[data-change-identity]');
  if (chg) chg.addEventListener('click', changeIdentity);
  const ref = document.querySelector('[data-refresh]');
  if (ref) ref.addEventListener('click', refreshFromServer);
  const exp = document.querySelector('[data-export]');
  if (exp) exp.addEventListener('click', exportData);
  document.querySelectorAll('[data-tab]').forEach(el => {
    el.addEventListener('click', () => setTab(el.getAttribute('data-tab')));
  });

  document.querySelectorAll('.day-cell').forEach(cell => {
    cell.addEventListener('click', () => openCell(cell.getAttribute('data-row'), cell.getAttribute('data-date')));
  });
  document.querySelectorAll('[data-summary]').forEach(cell => {
    cell.addEventListener('click', () => {
      state.summaryPopup = { date: cell.getAttribute('data-summary'), group: cell.getAttribute('data-group') };
      render();
    });
  });

  document.querySelectorAll('[data-close-overlay]').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target === e.currentTarget || e.target.hasAttribute('data-close-overlay')) closeCell();
    });
  });
  document.querySelectorAll('[data-close-summary]').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target === e.currentTarget || e.target.hasAttribute('data-close-summary')) {
        state.summaryPopup = null; render();
      }
    });
  });

  document.querySelectorAll('[data-edit-entry]').forEach(el => {
    el.addEventListener('click', () => openEditEntryForm(el.getAttribute('data-edit-entry')));
  });
  const addBtn = document.querySelector('[data-add-entry]');
  if (addBtn) addBtn.addEventListener('click', openNewEntryForm);
  const backBtn = document.querySelector('[data-back-to-list]');
  if (backBtn) backBtn.addEventListener('click', backToList);

  const tagOpts = document.querySelectorAll('[data-tag-opt]');
  tagOpts.forEach(el => {
    el.addEventListener('click', () => {
      tagOpts.forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
    });
  });

  const openChk = document.getElementById('f-open');
  const endInput = document.getElementById('f-end');
  if (openChk && endInput) {
    openChk.addEventListener('change', () => { endInput.disabled = openChk.checked; });
  }

  const saveBtn = document.querySelector('[data-save-entry]');
  if (saveBtn) {
    saveBtn.addEventListener('click', () => {
      const { row, entryId } = state.activeCell;
      const startVal = document.getElementById('f-start').value;
      const openVal = document.getElementById('f-open').checked;
      const endVal = openVal ? null : (document.getElementById('f-end').value || startVal);
      const memoVal = document.getElementById('f-memo').value;
      const selected = document.querySelector('.tag-opt.selected');
      const tagVal = selected ? selected.getAttribute('data-tag-opt') : 'other';
      if (!openVal && cmpDate(endVal, startVal) < 0) { alert('終了日は開始日より後にしてください'); return; }
      saveEntry(row, entryId, tagVal, memoVal, startVal, endVal);
    });
  }
  const delBtn = document.querySelector('[data-delete-entry]');
  if (delBtn) {
    delBtn.addEventListener('click', () => {
      const { row, entryId } = state.activeCell;
      deleteEntryById(row, entryId);
    });
  }
}

// init
if (state.identity) { render(); loadData(); } else { render(); }

setInterval(() => {
  if (state.identity && state.loaded && !state.activeCell && !state.summaryPopup) refreshFromServer();
}, 20000);

})();
</script>
</body>
</html>
